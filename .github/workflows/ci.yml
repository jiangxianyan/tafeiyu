name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install client dependencies
        run: python -m pip install -r requirements-launcher.txt

      - name: Project checks
        run: python scripts/check_project.py

      - name: Unit tests
        run: python -m unittest discover -s tests -v

      - name: Build source package
        run: python scripts/build_offline_package.py --output dist

      - name: Upload source package
        uses: actions/upload-artifact@v4
        with:
          name: tafeiyu-source-package
          path: |
            dist/*.zip
            dist/SHA256SUMS.json
