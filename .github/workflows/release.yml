name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: python -m pip install -r requirements-launcher.txt

      - name: Verify project
        run: |
          python scripts/check_project.py
          python -m unittest discover -s tests -v

      - name: Build release source bundle
        run: python scripts/build_offline_package.py --output dist

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: tafeiyu-release-${{ github.ref_name }}
          path: |
            dist/*.zip
            dist/SHA256SUMS.json

      - name: Publish GitHub release
        if: startsWith(github.ref, 'refs/tags/')
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${{ github.ref_name }}" dist/*.zip dist/SHA256SUMS.json --generate-notes
